trigger:
  branches:
    include:
      - preview
      - latest

pr: none

variables:
  - group: intelewriter-acr
  - name: imageRepositoryPrefix
    value: ''
  - name: vmImageName
    value: ubuntu-latest

pool:
  vmImage: $(vmImageName)

steps:
  - checkout: self
    fetchDepth: 1

  - bash: |
      set -euo pipefail

      if [[ "$SOURCE_BRANCH" != "preview" && "$SOURCE_BRANCH" != "latest" ]]; then
        echo "Unsupported source branch: $SOURCE_BRANCH"
        exit 1
      fi

      cleanup_docker_space() {
        docker buildx prune --all --force >/dev/null 2>&1 || true
        docker system prune --all --force --volumes >/dev/null 2>&1 || true
      }

      report_disk_usage() {
        echo "=== Disk usage ==="
        df -h / || true
        echo "=== Docker disk usage ==="
        docker system df || true
      }

      cleanup() {
        cleanup_docker_space
        docker logout "$ACR_LOGIN_SERVER" >/dev/null 2>&1 || true
      }
      trap cleanup EXIT

      cleanup_docker_space
      report_disk_usage

      printf '%s' "$ACR_TOKEN_PASSWORD" |
        docker login --password-stdin \
          --username "$ACR_TOKEN_NAME" \
          "$ACR_LOGIN_SERVER"

      short_sha="${SOURCE_VERSION:0:12}"
      immutable_tag="${SOURCE_BRANCH}-${BUILD_ID}-${short_sha}"
      build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      build_image() {
        local repository="$1"
        local dockerfile="$2"
        local target="$3"
        local image="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY_PREFIX}${repository}"

        docker buildx build \
          --platform linux/amd64 \
          --file "$SOURCE_DIRECTORY/$dockerfile" \
          --target "$target" \
          --tag "${image}:${SOURCE_BRANCH}" \
          --tag "${image}:${immutable_tag}" \
          --build-arg "BUILD_COMMIT=${SOURCE_VERSION}" \
          --build-arg "BUILD_BRANCH=${SOURCE_BRANCH}" \
          --build-arg "BUILD_DATE=${build_date}" \
          --push \
          "$SOURCE_DIRECTORY"

        cleanup_docker_space
        report_disk_usage
      }

      build_image codeapi-api service/Dockerfile api
      build_image codeapi-worker service/Dockerfile worker
      build_image codeapi-file-server service/Dockerfile production
      build_image codeapi-egress-gateway service/Dockerfile.egress-gateway production
      build_image codeapi-tool-call-server service/Dockerfile.tool-call-server production
      build_image codeapi-sandbox-runner api/Dockerfile sandbox-runner-baked
    env:
      ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)
      ACR_TOKEN_NAME: $(ACR_TOKEN_NAME)
      ACR_TOKEN_PASSWORD: $(ACR_TOKEN_PASSWORD)
      IMAGE_REPOSITORY_PREFIX: $(imageRepositoryPrefix)
      SOURCE_BRANCH: $(Build.SourceBranchName)
      SOURCE_VERSION: $(Build.SourceVersion)
      BUILD_ID: $(Build.BuildId)
      SOURCE_DIRECTORY: $(Build.SourcesDirectory)
